name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Audit eligible LOC
        run: |
          python - <<'PY'
          from pathlib import Path
          extensions = {".py", ".js", ".jsx", ".ts", ".tsx", ".java", ".cpp", ".c", ".h", ".hpp", ".go", ".rs", ".rb", ".php"}
          excluded = {"node_modules", "dist", "build", "coverage", ".venv", "venv", "vendor", "generated"}
          files = []
          loc = 0
          for p in Path(".").rglob("*"):
              if not p.is_file() or p.suffix not in extensions:
                  continue
              if any(part in excluded for part in p.parts):
                  continue
              files.append(p)
              loc += sum(1 for line in p.read_text(encoding="utf-8").splitlines() if line.strip())
          print(f"ELIGIBLE_LOC={loc}")
          print(f"ELIGIBLE_FILES={len(files)}")
          if loc < 5000:
              print("STATUS=BELOW_5000")
          else:
              print("STATUS=MEETS_5000")
          PY
